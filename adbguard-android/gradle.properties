# ----------------------------------------------------------------------
#  内存设置 —— 低配 / 内存紧张环境专用
#
#  现场记录（2026-09-27）：
#    物理内存 7.9 GB、可用常不足 2.5 GB；
#    页面文件位于 C 盘，而 C 盘长期接近占满 → 页面文件无法增长。
#    结果：JVM 一提堆就崩，两个不同的崩法：
#      · hs_err_pid*.log  → "insufficient memory ... malloc failed"
#      · 或直接 java.lang.OutOfMemoryError（在解压 jar 的 native 阶段）
#
#  这里的参数刻意压到最小：
#    -Xmx640m                   堆上限
#    -XX:MaxMetaspaceSize=224m  元空间封顶
#    -XX:ReservedCodeCacheSize  代码缓存封顶
#    -XX:TieredStopAtLevel=1    ★关键★ 只用 C1 编译器，彻底禁用 C2
#    -XX:+UseSerialGC           单线程 GC，省掉 GC 线程的内存
#    org.gradle.parallel=false  不并发 worker
#    org.gradle.workers.max=1   进一步限流
#
#  ------------------------------------------------------------------
#  为什么必须加 -XX:TieredStopAtLevel=1（血泪教训，别删）
#
#  JIT 分两级：C1 编译快、省内存；C2 优化狠、但编译时要在 **native arena**
#  里分配大量临时内存，且这部分内存**不受 -Xmx 管**。
#  本机 8GB 物理内存、崩时只剩 1.5GB 可用，于是 C2 一边编一边 malloc，
#  终于炸在 Chunk::new —— 日志形如：
#      # Native memory allocation (malloc) failed to allocate ... for Chunk::new
#      # Out of Memory Error (arena.cpp:168)
#  Gradle 构建是短命进程，根本用不上 C2 的极致优化，关掉它损失极小、
#  收益极大。加上这一行后 native 分配明显下降。
#
#  ------------------------------------------------------------------
#  另一个坑：别加 -XX:CICompilerCount=1
#  tiered 模式下最少要 2，写了会报
#      "CICompilerCount (1) must be at least 2"，JVM 直接起不来。
#
#  内存宽裕（可用 > 6GB）时可改回：
#    -Xmx2048m -Dfile.encoding=UTF-8 + org.gradle.parallel=true
#  会明显快不少。
# ----------------------------------------------------------------------
org.gradle.jvmargs=-Xmx640m -XX:MaxMetaspaceSize=224m -XX:ReservedCodeCacheSize=64m -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=1
org.gradle.vfs.watch=false

android.useAndroidX=false
android.nonTransitiveRClass=true
